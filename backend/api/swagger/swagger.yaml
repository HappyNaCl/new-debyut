          schema:
            properties:
              error:
                type: string
            type: object
        "429":
          description: OTP requested too recently
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Verify the organization email (step 1 — email OTP)
      tags:
      - Organizer Applications
