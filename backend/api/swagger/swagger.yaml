  /organizer-applications:
    post:
      consumes:
      - application/json
      description: Submits the application for admin review using the verified organization
        email. Users and existing organizers can apply (an organizer applies to create
        another organization). A user may have one pending application at a time and
        can apply again after a decline.
      parameters:
      - description: Verification token and organization details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SubmitApplicationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            properties:
              data:
                $ref: '#/definitions/dto.ApplicationResponse'
            type: object
        "400":
          description: Validation error, or email verification expired
          schema:
            properties:
              error:
                type: object
            type: object
        "401":
          description: Missing or invalid access token
          schema:
            properties:
              error:
                type: string
            type: object
        "403":
          description: Admins cannot apply
          schema:
            properties:
              error:
                type: string
            type: object
        "409":
          description: An application is already pending
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Submit the organizer application (step 3 — Work with us)
      tags:
      - Organizer Applications
  /organizer-applications/email:
    post:
      consumes:
      - application/json
      description: Emails a one-time password to the organization's email. Calling
        it again resends the code (1-minute cooldown). The code expires after 5 minutes
        or 5 wrong attempts.
      parameters:
      - description: Organization email
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.OrganizationEmailRequest'
