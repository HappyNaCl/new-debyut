            properties:
              error:
                type: object
            type: object
        "401":
          description: Missing or invalid access token
          schema:
            properties:
              error:
                type: string
            type: object
        "403":
          description: Admins cannot apply
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: Verify the organization email OTP (step 2)
      tags:
      - Organizer Applications
