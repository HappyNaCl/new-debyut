      - application/json
      description: Exchanges a valid OTP for a verification token (valid 30 minutes)
        that authorizes submitting the application.
      parameters:
      - description: Organization email and 6-digit OTP
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.VerifyOrganizationEmailRequest'
      produces:
      - application/json
      responses:
