root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api-gateway ./cmd/api-gateway"
  bin = "./tmp/api-gateway"
  include_dir = ["cmd/api-gateway", "internal/gateway", "internal/common", "internal/genproto"]
  exclude_dir = ["tmp", "vendor"]
  include_ext = ["go"]
  delay = 1000
  poll = true
  poll_interval = 1000
  kill_delay = 500

[log]
  time = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true