<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to debyut</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #e8f5f4;
      font-family: Arial, Helvetica, sans-serif;
    ">
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #e8f5f4; padding: 40px 0">
      <tr>
        <td align="center">
          <table
            width="600"
            cellpadding="0"
            cellspacing="0"
            style="
              background-color: #ffffff;
              border-radius: 12px;
              overflow: hidden;
              box-shadow: 0 2px 12px rgba(0, 0, 0, 0.07);
            ">
            <tr>
              <td
                align="center"
                style="background-color: #0e7070; padding: 32px 40px">
                <img
                  src="cid:logo"
                  alt="debyut"
                  width="160"
                  style="display: block" />
              </td>
            </tr>

            <tr>
              <td style="padding: 40px 48px 32px">
                <h1 style="margin: 0 0 12px; font-size: 24px; color: #0e7070">
                  Welcome, {{.FirstName}}!
                </h1>
                <p
                  style="
                    margin: 0 0 20px;
                    font-size: 15px;
                    line-height: 1.6;
                    color: #444444;
                  ">
                  Your debyut account is ready. Start exploring and enjoy the
                  best shopping deals curated just for you.
                </p>
                <table cellpadding="0" cellspacing="0">
                  <tr>
                    <td
                      align="center"
                      style="background-color: #f7921e; border-radius: 8px">
                      <a
                        href="https://debyut.com"
                        style="
                          display: inline-block;
                          padding: 13px 32px;
                          font-size: 15px;
                          font-weight: bold;
                          color: #ffffff;
                          text-decoration: none;
                        ">
                        Start Shopping
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td style="padding: 0 48px">
                <hr
                  style="
                    border: none;
                    border-top: 1px solid #e0f0ef;
                    margin: 0;
                  " />
              </td>
            </tr>

            <tr>
              <td style="padding: 24px 48px 32px">
                <p
                  style="
                    margin: 0;
                    font-size: 12px;
                    color: #999999;
                    line-height: 1.6;
                  ">
                  You received this email because you created a debyut
                  account.<br />
                  If this wasn't you, please ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
